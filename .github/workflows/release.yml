name: Release to npm

on:
  push:
    tags: ["v*"]

# Trusted publishing (OIDC): npm exchanges this workflow's OIDC token for a
# short-lived publish credential. No long-lived NPM_TOKEN secret is needed.
# Requires a one-time "Trusted Publisher" configuration on the npm package
# (npmjs.com -> package -> Settings -> Trusted Publishers):
#   owner: EnzoVezzaro  repository: proagents  workflow: release.yml
# and npm >= 11.5.1 (Node 24 bundles a compatible CLI).
permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify the CLI runs
        run: node ./dist/cli/index.js --version
      - run: npm publish --provenance --access public
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
